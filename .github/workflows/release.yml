name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm install

      # 打包资源要求：tauri.conf.json 将 target/release/cli-companion-daemon.exe
      # 作为随包分发的资源，必须先于 tauri build 编译产出
      - name: Build daemon (release)
        run: cargo build --release -p cli-companion-daemon

      # 安装 cargo 版 tauri-cli（自带 NSIS 插件，避免 npm 版插件缺失问题）
      - name: Install cargo tauri-cli
        run: cargo install tauri-cli --locked

      # 用 cargo 版 tauri build（自带 NSIS 插件，避免 npm 版插件缺失）
      - name: Build installer (cargo)
        shell: bash
        run: cargo tauri build

      # 获取版本号（取自 tag，如 v1.3.0）
      - name: Get version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          echo "version=$tag" >> $env:GITHUB_OUTPUT
          $exeName = "CLI-Companion_$($tag)_x64-setup.exe"
          echo "exeName=$exeName" >> $env:GITHUB_OUTPUT
          Write-Output "version=$tag exeName=$exeName"

      # 安装包重命名为 ASCII 文件名（避免空格/中文名在 Release 上传时出问题），
      # 并汇总到固定目录（workspace 布局下产物在根 target/，独立布局在 src-tauri/target/）
      - name: Rename installer
        shell: bash
        run: |
          mkdir -p dist-release
          # find 对不存在的候选路径会返回非零（set -e/-o pipefail 下致命），需容错
          f=$((find target/release/bundle/nsis src-tauri/target/release/bundle/nsis -name '*_x64-setup.exe' 2>/dev/null || true) | head -1)
          if [ -z "$f" ]; then
            echo "未找到安装包：" && find . -name '*.exe' -path '*nsis*' && exit 1
          fi
          mv "$f" "dist-release/${{ steps.version.outputs.exeName }}"
          ls -la dist-release/

      # 创建 GitHub Release 并上传安装包
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## ${{ github.ref_name }}
            - **安装包**：`${{ steps.version.outputs.exeName }}`（NSIS / x64）
            - 含 `cli-companion-gui.exe` + `cli-companion-daemon.exe`
            - 由 GitHub Actions 在 Windows 环境自动编译；安装包未签名，首次运行如遇 SmartScreen 提示请选择"仍要运行"
          files: |
            dist-release/*.exe
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
