[package]
name = "cli-companion-gui-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GUI 核心层：Tauri 命令边界 + daemon 管道客户端"

[lib]
name = "gui_core"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
cli-companion-protocol.workspace = true
cli-companion-platform.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
# v2.2.0：内嵌终端 ConPTY
portable-pty = "0.9"
# v2.3.0：系统剪贴板（选中即复制，绕开 WebView2 剪贴板权限不确定性）
arboard = "3"
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
chrono.workspace = true
