[package]
name = "cli-companion-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI Companion 守护进程：服务编排、配置持久化、命名管道 RPC、WebDAV 同步"

[[bin]]
name = "cli-companion-daemon"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
sha2 = "0.10"
tracing-appender = "0.2"
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

cli-companion-protocol.workspace = true
cli-companion-domain.workspace = true
cli-companion-platform.workspace = true
cli-companion-webdav = { path = "../webdav-client" }

# Win32 服务支持（SCM 调度/安装/卸载）
windows-service = "0.8"
